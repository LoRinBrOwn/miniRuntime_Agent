<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniAgent Runtime</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #18202b;
      --muted: #657184;
      --line: #dce1e8;
      --accent: #2563eb;
      --accent-weak: #e8f0ff;
      --ok: #087f5b;
      --bad: #b42318;
    }
    * { box-sizing: border-box; }
    html {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr) 360px;
      grid-template-rows: minmax(0, 1fr);
      overflow: hidden;
    }
    aside, main, section { min-height: 0; }
    aside {
      border-right: 1px solid var(--line);
      background: #fbfcfe;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .brand { font-weight: 700; font-size: 18px; }
    .row { display: flex; gap: 8px; align-items: center; }
    input, textarea, button {
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      background: white;
      color: var(--ink);
    }
    button {
      padding: 9px 12px;
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      cursor: pointer;
      white-space: nowrap;
    }
    button.secondary {
      background: white;
      color: var(--ink);
      border-color: var(--line);
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #sessions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: auto;
    }
    .session {
      padding: 10px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
    }
    .session.active { border-color: var(--accent); background: var(--accent-weak); }
    .session .title { font-weight: 700; overflow-wrap: anywhere; }
    .session .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .session-delete {
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 6px;
      background: white;
      color: var(--bad);
      border-color: var(--line);
      font-size: 16px;
      line-height: 1;
    }
    main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background: var(--panel);
    }
    header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    #messages {
      overflow: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #messages.empty-view {
      justify-content: center;
      align-items: center;
    }
    .empty-state {
      width: min(420px, 100%);
      text-align: center;
      color: var(--muted);
      padding: 28px 18px;
    }
    .empty-state strong {
      display: block;
      color: var(--ink);
      font-size: 17px;
      margin-bottom: 8px;
    }
    .empty-state p {
      margin: 0;
      line-height: 1.6;
      font-size: 14px;
    }
    .msg {
      max-width: 78%;
      padding: 11px 13px;
      border-radius: 8px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user { align-self: flex-end; background: var(--accent); color: white; }
    .assistant { align-self: flex-start; background: #eef2f7; }
    .tool { align-self: flex-start; background: #f7f5ea; color: #4f4630; font-size: 13px; }
    #chatForm {
      border-top: 1px solid var(--line);
      padding: 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }
    .chat-tools {
      border-top: 1px solid var(--line);
      padding: 10px 14px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
      background: #fbfcfe;
    }
    .chat-tools span {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .chat-tools input { min-width: 0; }
    textarea { resize: none; height: 54px; }
    main.no-session {
      grid-template-rows: auto minmax(0, 1fr);
    }
    main.no-session .chat-tools,
    main.no-session #chatForm {
      display: none;
    }
    section.side {
      border-left: 1px solid var(--line);
      background: #fbfcfe;
      padding: 16px;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      min-height: 0;
    }
    .panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
    }
    #trace {
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .event {
      background: white;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
    }
    .event strong { display: block; margin-bottom: 6px; }
    pre {
      margin: 0;
      color: var(--muted);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: Consolas, monospace;
      font-size: 12px;
    }
    .todo-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      white-space: normal;
      max-width: min(680px, 92%);
    }
    .todo-card > strong {
      font-size: 15px;
    }
    .todo-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .todo-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
    }
    .todo-row:hover {
      border-color: #b7c4d8;
    }
    .todo-main {
      min-width: 0;
    }
    .todo-actions {
      display: flex;
      gap: 6px;
    }
    .todo-actions button {
      padding: 5px 8px;
      border-radius: 6px;
      background: white;
      color: var(--accent);
      font-weight: 700;
      font-size: 12px;
    }
    .todo-actions .undo {
      color: var(--ok);
    }
    .todo-row.completed {
      background: #f8fafc;
    }
    .todo-row.completed .todo-title {
      text-decoration: line-through;
      color: var(--muted);
    }
    .todo-title {
      overflow-wrap: anywhere;
      line-height: 1.4;
      font-weight: 700;
    }
    .todo-meta {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .todo-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #f8fafc;
      color: #41516a;
      padding: 2px 7px;
      line-height: 1.5;
    }
    .todo-pill.due {
      border-color: #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
    }
    .todo-pill.done {
      border-color: #b7ead8;
      background: #effcf7;
      color: var(--ok);
    }
    .completed-group {
      border-top: 1px dashed var(--line);
      padding-top: 8px;
    }
    .completed-group summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
      user-select: none;
    }
    .empty {
      color: var(--muted);
      background: white;
      border: 1px dashed var(--line);
      border-radius: 6px;
      padding: 12px;
      font-size: 13px;
    }
    @media (max-width: 980px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) 420px; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 220px; }
      section.side { border-left: 0; border-top: 1px solid var(--line); }
      .chat-tools { grid-template-columns: 1fr auto auto; }
      .chat-tools span { display: none; }
      .msg { max-width: 92%; }
    }
  </style>
</head>
<body>
  <aside>
    <div class="brand">MiniAgent Runtime</div>
    <input id="userId" value="user_a" aria-label="user id">
    <button id="newSession">新建会话</button>
    <div id="sessions"></div>
  </aside>

  <main>
    <header>
      <div>
        <strong id="sessionTitle">未选择会话</strong>
        <div id="sessionMeta" style="color: var(--muted); font-size: 13px;"></div>
      </div>
      <button class="secondary" id="refresh">刷新</button>
    </header>
    <div id="messages"></div>
    <form id="todoToolForm" class="chat-tools">
      <span>Todo</span>
      <input id="inlineTodoTitle" placeholder="当前会话新增待办">
      <button id="inlineAddTodo">添加</button>
      <button id="inlineListTodo" type="button" class="secondary">查看</button>
    </form>
    <form id="chatForm">
      <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button id="send">发送</button>
    </form>
  </main>

  <section class="side">
    <div class="panel">
      <div>
        <strong>Trace</strong>
        <div style="color: var(--muted); font-size: 13px;">当前轮次的执行事件</div>
      </div>
      <div id="trace"></div>
    </div>
  </section>

  <script>
    let activeSession = null;
    let busy = false;

    const $ = (id) => document.getElementById(id);
    const api = async (url, options = {}) => {
      const res = await fetch(url, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || data.error || "request failed");
      return data;
    };

    async function loadSessions() {
      const userId = $("userId").value.trim();
      if (!userId) return;
      const data = await api(`/api/sessions?user_id=${encodeURIComponent(userId)}`);
      $("sessions").innerHTML = "";
      data.sessions.forEach((session) => {
        const node = document.createElement("div");
        node.className = "session" + (activeSession === session.id ? " active" : "");
        node.innerHTML = `
          <div>
            <div class="title">${escapeHtml(session.title)}</div>
            <div class="meta">${session.id}</div>
          </div>
          <button class="session-delete" title="删除会话">×</button>
        `;
        node.onclick = () => selectSession(session.id, session.title);
        const deleteButton = node.querySelector(".session-delete");
        deleteButton.onclick = async (event) => {
          event.stopPropagation();
          await deleteSession(session.id);
        };
        $("sessions").appendChild(node);
      });
      if (!activeSession && data.sessions.length > 0) {
        const session = data.sessions[0];
        await selectSession(session.id, session.title);
      } else if (!activeSession) {
        renderEmptyState("no-session");
      }
    }

    async function selectSession(id, title) {
      activeSession = id;
      document.querySelector("main").classList.remove("no-session");
      $("sessionTitle").textContent = title || id;
      $("sessionMeta").textContent = id;
      await Promise.all([loadSessions(), loadMessages()]);
      $("trace").innerHTML = "";
    }

    async function deleteSession(sessionId) {
      if (!confirm("删除这个会话？消息和 Trace 会一起删除，待办会保留。")) return;
      await api(`/api/sessions/${encodeURIComponent(sessionId)}?user_id=${encodeURIComponent($("userId").value.trim())}`, {
        method: "DELETE"
      });
      if (activeSession === sessionId) {
        activeSession = null;
        $("sessionTitle").textContent = "未选择会话";
        $("sessionMeta").textContent = "";
        renderEmptyState("no-session");
        $("trace").innerHTML = "";
      }
      await loadSessions();
    }

    async function loadMessages() {
      if (!activeSession) {
        renderEmptyState("no-session");
        return;
      }
      const userId = $("userId").value.trim();
      const data = await api(`/api/sessions/${activeSession}/messages?user_id=${encodeURIComponent(userId)}`);
      $("messages").innerHTML = "";
      data.messages.forEach(addMessage);
      if (data.messages.length === 0) {
        renderEmptyState("empty-session");
      } else {
        $("messages").classList.remove("empty-view");
      }
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    function renderEmptyState(type) {
      document.querySelector("main").classList.toggle("no-session", type === "no-session");
      const empty = type === "empty-session"
        ? {
            title: "这个会话还没有消息",
            body: "可以开始聊天，或者先添加一条当前会话待办。"
          }
        : {
            title: "还没有选择会话",
            body: "新建会话后，消息、Todo 和 Trace 会在这里出现。"
          };
      $("messages").classList.add("empty-view");
      $("messages").innerHTML = `
        <div class="empty-state">
          <strong>${empty.title}</strong>
          <p>${empty.body}</p>
        </div>
      `;
    }

    async function completeTodo(todoId) {
      await api(`/api/todos/${encodeURIComponent(todoId)}/complete`, {
        method: "POST",
        body: JSON.stringify({ user_id: $("userId").value.trim(), session_id: activeSession })
      });
      await loadMessages();
    }

    async function reopenTodo(todoId) {
      await api(`/api/todos/${encodeURIComponent(todoId)}/reopen`, {
        method: "POST",
        body: JSON.stringify({ user_id: $("userId").value.trim(), session_id: activeSession })
      });
      await loadMessages();
    }

    function addMessage(message) {
      if ($("messages").classList.contains("empty-view")) {
        $("messages").classList.remove("empty-view");
        $("messages").innerHTML = "";
      }
      document.querySelector("main").classList.remove("no-session");
      const node = document.createElement("div");
      node.className = `msg ${message.role}`;
      if (message.message_type === "tool_call") {
        return;
      }
      const markdownTodos = message.role === "assistant" ? parseMarkdownTodoTable(message.content) : [];
      if (isTodoUiMessage(message)) {
        node.className = "msg assistant todo-card";
        node.innerHTML = renderTodoMessage(message);
        bindTodoActions(node);
      } else if (markdownTodos.length > 0) {
        node.className = "msg assistant todo-card";
        node.innerHTML = renderMarkdownTodoMessage(message.content, markdownTodos);
        bindTodoActions(node);
      } else if (message.role === "tool") {
        node.textContent = `[${message.tool_name}] ${message.content}`;
      } else {
        node.textContent = message.content;
      }
      $("messages").appendChild(node);
    }

    function isTodoUiMessage(message) {
      return (message.role === "tool" && message.tool_name === "todo") || message.message_type === "todo_ui";
    }

    function bindTodoActions(node) {
      node.querySelectorAll("[data-todo-action]").forEach((button) => {
        button.onclick = async () => {
          if (button.dataset.todoAction === "complete") {
            await completeTodo(button.dataset.todoId);
          } else if (button.dataset.todoAction === "reopen") {
            await reopenTodo(button.dataset.todoId);
          }
        };
      });
    }

    function renderTodoMessage(message) {
      let payload;
      try {
        payload = JSON.parse(message.content);
      } catch {
        return `[todo] ${escapeHtml(message.content)}`;
      }
      if (!payload.success) {
        return `<strong>Todo 操作失败</strong><div>${escapeHtml(payload.error || "unknown error")}</div>`;
      }
      const data = payload.data || {};
      if (Array.isArray(data.todos)) {
        if (data.todos.length === 0) {
          return `<strong>Todo 列表</strong><div class="empty">当前会话暂无待办</div>`;
        }
        return `<strong>Todo 列表</strong>${renderTodoList(data.todos)}`;
      }
      const entries = [
        ["created", "已创建待办"],
        ["completed", "已完成待办"],
        ["reopened", "已撤回完成状态"],
      ];
      for (const [key, title] of entries) {
        if (data[key]) {
          return `<strong>${title}</strong>${renderTodoList([data[key]], { showCompletedOpen: true })}`;
        }
      }
      return `<strong>Todo 结果</strong><pre>${escapeHtml(JSON.stringify(payload, null, 2))}</pre>`;
    }

    function renderMarkdownTodoMessage(content, todos) {
      const text = stripMarkdownTodoTable(content).trim();
      const textHtml = text ? `<div class="todo-note">${escapeHtml(text)}</div>` : "";
      return `${textHtml}<strong>Todo 列表</strong>${renderTodoList(todos)}`;
    }

    function parseMarkdownTodoTable(content) {
      if (!content || !content.includes("todo_")) return [];
      const todos = [];
      String(content).split(/\r?\n/).forEach((line) => {
        const trimmed = line.trim();
        if (!trimmed.startsWith("|") || trimmed.includes("---")) return;
        const cells = trimmed.split("|").slice(1, -1).map((cell) => cell.trim());
        const idIndex = cells.findIndex((cell) => /`?todo_[A-Za-z0-9_]+`?/.test(cell));
        if (idIndex < 0 || idIndex + 1 >= cells.length || cells.length < 3) return;
        const rawId = cells[idIndex].match(/todo_[A-Za-z0-9_]+/)[0];
        const title = cells[idIndex + 1] || "未命名待办";
        const statusText = cells.join(" ");
        todos.push({
          id: rawId,
          title: title.replace(/`/g, ""),
          status: /已完成|completed|done/i.test(statusText) ? "completed" : "pending",
          source_session_id: activeSession,
          due_at: ""
        });
      });
      return todos;
    }

    function stripMarkdownTodoTable(content) {
      return String(content)
        .split(/\r?\n/)
        .filter((line) => {
          const trimmed = line.trim();
          return !trimmed.startsWith("|");
        })
        .join("\n");
    }

    function renderTodoList(todos, options = {}) {
      const normalized = todos.map(normalizeTodoForDisplay);
      const pending = normalized.filter((todo) => todo.status !== "completed");
      const completed = normalized.filter((todo) => todo.status === "completed");
      const pendingHtml = pending.length > 0
        ? `<div class="todo-list">${pending.map(renderTodoRow).join("")}</div>`
        : "";
      if (completed.length === 0) {
        return pendingHtml || `<div class="empty">暂无待办</div>`;
      }
      const completedRows = `<div class="todo-list">${completed.map(renderTodoRow).join("")}</div>`;
      if (options.showCompletedOpen) {
        return `${pendingHtml}${completedRows}`;
      }
      const completedHtml = `<details class="completed-group"><summary>已完成 ${completed.length} 项</summary>${completedRows}</details>`;
      return `${pendingHtml || `<div class="empty">暂无待完成待办</div>`}${completedHtml}`;
    }

    function renderTodoRow(todo) {
      const statusText = todo.status === "completed" ? "已完成" : "待完成";
      const action = todo.status === "completed"
        ? `<button class="undo" data-todo-action="reopen" data-todo-id="${escapeHtml(todo.id)}">撤回</button>`
        : `<button data-todo-action="complete" data-todo-id="${escapeHtml(todo.id)}">完成</button>`;
      const dueText = formatTodoDateTime(todo.due_at);
      const createdText = formatTodoDateTime(todo.created_at);
      const meta = [
        `<span class="todo-pill ${todo.status === "completed" ? "done" : ""}">${statusText}</span>`,
        dueText ? `<span class="todo-pill due">到期 ${escapeHtml(dueText)}</span>` : "",
        createdText ? `<span class="todo-pill">创建 ${escapeHtml(createdText)}</span>` : "",
      ].filter(Boolean).join("");
      return `
        <div class="todo-row ${todo.status === "completed" ? "completed" : ""}">
          <div class="todo-main">
            <div class="todo-title">${escapeHtml(todo.title)}</div>
            <div class="todo-meta">${meta}</div>
          </div>
          <div class="todo-actions">${action}</div>
        </div>
      `;
    }

    function normalizeTodoForDisplay(todo) {
      if (!todo || todo.due_at || !todo.title || !todo.created_at) return todo;
      const match = String(todo.title).match(/今天|明天|后天/);
      if (!match) return todo;
      const createdAt = new Date(todo.created_at);
      if (Number.isNaN(createdAt.getTime())) return todo;
      const base = getDatePartsInTimeZone(createdAt, "Asia/Shanghai");
      const offset = { "今天": 0, "明天": 1, "后天": 2 }[match[0]];
      const target = new Date(Date.UTC(base.year, base.month - 1, base.day + offset));
      const dateText = formatUtcDate(target);
      const after = String(todo.title).slice(match.index + match[0].length);
      const timeMatch = after.match(/^\s*(凌晨|早上|上午|中午|下午|傍晚|晚上)?\s*(\d{1,2}|[零〇一二两三四五六七八九十]{1,3})(?:\s*(?:点|:|：)\s*(半|\d{1,2}|[零〇一二三四五六七八九十]{1,3})?)?/);
      const parsedTime = parseDisplayTime(timeMatch);
      const replacement = parsedTime ? `${dateText} ${parsedTime}` : dateText;
      const replaceEnd = match.index + match[0].length + (parsedTime && timeMatch ? timeMatch[0].length : 0);
      return {
        ...todo,
        title: replaceTodoTitle(String(todo.title), match.index, replaceEnd, replacement),
        due_at: parsedTime ? `${dateText}T${parsedTime}:00+08:00` : dateText
      };
    }

    function formatTodoDateTime(value) {
      if (!value) return "";
      const text = String(value);
      if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;
      if (text.includes("T")) return text.slice(0, 16).replace("T", " ");
      return text;
    }

    function getDatePartsInTimeZone(date, timeZone) {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(date);
      const value = Object.fromEntries(parts.map((part) => [part.type, part.value]));
      return { year: Number(value.year), month: Number(value.month), day: Number(value.day) };
    }

    function formatUtcDate(date) {
      const year = date.getUTCFullYear();
      const month = String(date.getUTCMonth() + 1).padStart(2, "0");
      const day = String(date.getUTCDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function parseDisplayTime(match) {
      if (!match) return "";
      let hour = parseDisplayNumber(match[2]);
      let minute = match[3] === "半" ? 30 : parseDisplayNumber(match[3] || "0");
      if (hour === null || minute === null || minute > 59) return "";
      const period = match[1] || "";
      if (["下午", "傍晚", "晚上"].includes(period) && hour >= 1 && hour < 12) hour += 12;
      if (period === "中午" && hour >= 1 && hour < 12) hour += 12;
      if (["凌晨", "早上", "上午"].includes(period) && hour === 12) hour = 0;
      if (hour > 23) return "";
      return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
    }

    function parseDisplayNumber(value) {
      if (/^\d+$/.test(value)) return Number(value);
      const digits = { "零": 0, "〇": 0, "一": 1, "二": 2, "两": 2, "三": 3, "四": 4, "五": 5, "六": 6, "七": 7, "八": 8, "九": 9 };
      if (value === "十") return 10;
      if (value.startsWith("十")) return 10 + (digits[value.slice(1)] || 0);
      if (value.includes("十")) {
        const [head, tail] = value.split("十");
        if (!(head in digits)) return null;
        return digits[head] * 10 + (tail ? digits[tail] : 0);
      }
      return value in digits ? digits[value] : null;
    }

    function replaceTodoTitle(text, start, end, replacement) {
      const prefix = text.slice(0, start).trimEnd();
      const suffix = text.slice(end).trimStart();
      const left = prefix && !" ，,。.;；:：".includes(prefix[prefix.length - 1]) ? " " : "";
      const right = suffix && !"，,。.;；:：".includes(suffix[0]) ? " " : "";
      return `${prefix}${left}${replacement}${right}${suffix}`.trim();
    }

    async function loadTrace(turnId) {
      const data = await api(`/api/turns/${turnId}/trace`);
      $("trace").innerHTML = "";
      data.events.forEach((event) => {
        const node = document.createElement("div");
        node.className = "event";
        node.innerHTML = `<strong>${event.event_type}</strong><pre>${escapeHtml(JSON.stringify(event.payload, null, 2))}</pre>`;
        $("trace").appendChild(node);
      });
    }

    async function createSession() {
      const userId = $("userId").value.trim();
      const data = await api("/api/sessions", {
        method: "POST",
        body: JSON.stringify({ user_id: userId, title: "Agent 会话" })
      });
      await selectSession(data.session.id, data.session.title);
      return data.session;
    }

    async function ensureSession() {
      if (!activeSession) {
        await createSession();
      }
      return activeSession;
    }

    $("newSession").onclick = async () => {
      await createSession();
    };

    $("refresh").onclick = () => Promise.all([loadSessions(), loadMessages()]);
    $("userId").onchange = async () => {
      activeSession = null;
      $("sessionTitle").textContent = "未选择会话";
      $("sessionMeta").textContent = "";
      renderEmptyState("no-session");
      $("trace").innerHTML = "";
      await loadSessions();
    };

    $("todoToolForm").onsubmit = async (event) => {
      event.preventDefault();
      const title = $("inlineTodoTitle").value.trim();
      if (!title) return;
      $("inlineAddTodo").disabled = true;
      try {
        await ensureSession();
        await api("/api/todos", {
          method: "POST",
          body: JSON.stringify({
            user_id: $("userId").value.trim(),
            session_id: activeSession,
            title
          })
        });
        $("inlineTodoTitle").value = "";
        await loadMessages();
      } catch (err) {
        addMessage({ role: "assistant", content: `待办创建失败：${err.message}` });
      } finally {
        $("inlineAddTodo").disabled = false;
      }
    };

    $("inlineListTodo").onclick = async () => {
      $("inlineListTodo").disabled = true;
      try {
        await ensureSession();
        await api("/api/todos/list", {
          method: "POST",
          body: JSON.stringify({
            user_id: $("userId").value.trim(),
            session_id: activeSession
          })
        });
        await loadMessages();
      } catch (err) {
        addMessage({ role: "assistant", content: `待办查询失败：${err.message}` });
      } finally {
        $("inlineListTodo").disabled = false;
      }
    };

    $("chatForm").onsubmit = async (event) => {
      event.preventDefault();
      if (busy) return;
      const content = $("input").value.trim();
      if (!content) return;
      busy = true;
      $("send").disabled = true;
      $("send").textContent = "发送中";
      $("input").value = "";
      try {
        await ensureSession();
        addMessage({ role: "user", content });
        const data = await api(`/api/sessions/${activeSession}/messages`, {
          method: "POST",
          body: JSON.stringify({ user_id: $("userId").value.trim(), content })
        });
        await loadMessages();
        await loadTrace(data.turn_id);
      } catch (err) {
        addMessage({ role: "assistant", content: `请求失败：${err.message}` });
      } finally {
        busy = false;
        $("send").disabled = false;
        $("send").textContent = "发送";
      }
    };

    $("input").addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        $("chatForm").requestSubmit();
      }
    });

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    loadSessions();
  </script>
</body>
</html>
